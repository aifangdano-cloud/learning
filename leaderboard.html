<!DOCTYPE html>
<html>
<head>
    <title>Leaderboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }

        table {
            margin: 30px auto;
            width: 80%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 15px;
            border: 1px solid #ddd;
        }

        th {
            background: #333;
            color: white;
        }
    </style>
</head>
<body>
    <h1>🏆 Leaderboard</h1>

    <table>
        <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Score</th>
        </tr>
        <tr>
            <td>🥇 1</td>
            <td>Alex</td>
            <td>100</td>
        </tr>
        <tr>
            <td>🥈 2</td>
            <td>John</td>
            <td>85</td>
        </tr>
        <tr>
            <td>🥉 3</td>
            <td>Mary</td>
            <td>70</td>
        </tr>
    </table>
</body>
</html>
